<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경희중 하키 훈련 메모</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#C4001E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하키 메모">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C4001E; --bg:#F1EEE8; --paper:#FFFFFF; --ink:#1A1A1A;
  --muted:#8A8578; --line:#E3DFD5; --rule:#D5D0C4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ── 인트로 ── */
#intro{
  position:fixed;inset:0;z-index:99;background:var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .45s ease;cursor:pointer;
}
#intro.out{opacity:0;pointer-events:none}
#intro img{width:132px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
#intro p{color:#fff;font-size:11px;letter-spacing:.32em;opacity:.9;font-weight:500}

/* ── 달력 ── */
.wrap{max-width:430px;margin:0 auto;padding:0 14px calc(30px + env(safe-area-inset-bottom,0px))}
.cal-head{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:26px 0 10px;
}
.cal-head h1{font-size:22px;font-weight:700;letter-spacing:.02em;min-width:128px;text-align:center}
.nav{width:44px;height:44px;border-radius:12px;font-size:20px;color:var(--muted)}
.nav:active{background:rgba(0,0,0,.06)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 0;border-bottom:1px solid var(--line)}
.wk span{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.wk span:first-child{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.day{
  aspect-ratio:1/1.06;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:15.5px;font-weight:500;position:relative;
}
.day:active{background:rgba(196,0,30,.07)}
.day.today{box-shadow:inset 0 0 0 2px var(--red);font-weight:700;color:var(--red)}
.day.dim{visibility:hidden}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--red)}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px}
.brand img{width:26px;border-radius:5px;opacity:.92}
.brand span{font-size:10px;letter-spacing:.26em;color:var(--muted);font-weight:500}

/* ── 메모 ── */
.memo-head{
  display:flex;align-items:center;gap:6px;
  padding:22px 0 10px;position:relative;
}
.back{width:44px;height:44px;border-radius:12px;font-size:20px;color:var(--muted)}
.back:active{background:rgba(0,0,0,.06)}
.memo-head h2{font-size:19px;font-weight:700;flex:1}
.memo-head img{width:42px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.sheet{
  background:var(--paper);border-radius:14px;box-shadow:0 1px 2px rgba(26,26,26,.06),0 6px 18px rgba(26,26,26,.06);
  padding:18px 16px;position:relative;
}
.hseal{width:42px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.14);flex:0 0 auto}
#mlist textarea{
  width:100%;border:none;resize:none;background:transparent;color:var(--ink);
  font-family:inherit;font-size:16.5px;line-height:34px;min-height:calc(34px*10);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);
  background-attachment:local;padding-right:38px;display:block;
}
#memo:focus{outline:none}
.saved{font-size:11px;color:var(--muted);text-align:right;height:16px;margin-top:6px;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 4px 0}
.alist{margin-top:26px;text-align:left}
.alist-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.arow{display:flex;align-items:center;gap:10px;width:100%;background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(26,26,26,.05);text-align:left}
.arow:active{transform:scale(.985)}
.ad{font-weight:700;font-size:14px;white-space:nowrap;color:var(--red)}
.ap{flex:1;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an{font-size:11px;color:#fff;background:var(--red);border-radius:999px;padding:2px 8px;font-weight:700}
.mcard{margin-bottom:12px}
.mdel{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:17px;line-height:1}
.mdel:active{background:rgba(0,0,0,.06)}
#addmemo{display:block;width:100%;margin-top:2px;border:2px dashed var(--rule);border-radius:12px;padding:14px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){#intro{transition:none}}
</style>
</head>

<script>
'use strict';
/* ── 저장소 (날짜별 메모 배열, 기존 문자열 자동 마이그레이션) ── */
var LS='kh_hockey_memo_v1';
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function loadMemos(){try{var o=JSON.parse(localStorage.getItem(LS)||'{}');if(!o||typeof o!=='object')return{};for(var k in o){if(typeof o[k]==='string'){o[k]=o[k].trim()?[{id:uid(),text:o[k],t:Date.now()}]:[]}else if(!Array.isArray(o[k]))o[k]=[]}return o}catch(e){return{}}}
function saveData(){try{localStorage.setItem(LS,JSON.stringify(memos))}catch(e){}}
var memos=loadMemos();
function hasMemo(k){return !!(memos[k]&&memos[k].some(function(m){return m.text.trim()}))}
function realText(t){return t.replace(/^[•\s]+/,'').trim()}

/* ── 공통 ── */
var DOW=['일','월','화','수','목','금','토'];
function pad(n){return (n<10?'0':'')+n}
function keyOf(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function todayKey(){var t=new Date();return keyOf(t.getFullYear(),t.getMonth(),t.getDate())}
function dateLabel(k){var p=k.split('-'),t=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+'월 '+(+p[2])+'일 ('+DOW[t.getDay()]+')'}
function shortLabel(k){var p=k.split('-');return p[1]+'.'+p[2]+' ('+DOW[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+')'}
function escHtml(x){return x.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ── 인트로 ── */
var intro=document.getElementById('intro');
function endIntro(){intro.classList.add('out')}
if(location.search.indexOf('nointro')>-1||window.NOINTRO){endIntro()}
else{intro.addEventListener('click',endIntro);setTimeout(endIntro,1300)}

/* ── 달력 ── */
var vy,vm;
(function(){var t=new Date();vy=t.getFullYear();vm=t.getMonth();})();
var grid=document.getElementById('grid'),mtitle=document.getElementById('mtitle'),allbox=document.getElementById('allmemos');
function renderCal(){
  mtitle.textContent=vy+'년 '+(vm+1)+'월';
  var first=new Date(vy,vm,1).getDay();
  var last=new Date(vy,vm+1,0).getDate();
  var tk=todayKey(),h='';
  for(var i=0;i<first;i++)h+='<span class="day dim"></span>';
  for(var d=1;d<=last;d++){
    var k=keyOf(vy,vm,d);
    var dot=hasMemo(k)?'<span class="dot"></span>':'<span style="height:5px"></span>';
    h+='<button class="day'+(k===tk?' today':'')+'" data-d="'+k+'" aria-label="'+(vm+1)+'월 '+d+'일">'+d+dot+'</button>';
  }
  grid.innerHTML=h;
  var ks=Object.keys(memos).filter(hasMemo).sort().reverse();
  if(ks.length){
    allbox.innerHTML='<div class="alist-h">저장된 메모</div>'+ks.map(function(k){
      var arr=memos[k].filter(function(m){return realText(m.text)});
      var pv=realText(arr[0].text).split('\n')[0];
      return '<button class="arow" data-d="'+k+'"><span class="ad">'+shortLabel(k)+'</span><span class="ap">'+escHtml(pv)+'</span><span class="an">'+arr.length+'</span></button>';
    }).join('');
    allbox.hidden=false;
  }else{allbox.hidden=true;allbox.innerHTML='';}
}
document.getElementById('prev').addEventListener('click',function(){vm--;if(vm<0){vm=11;vy--}renderCal()});
document.getElementById('next').addEventListener('click',function(){vm++;if(vm>11){vm=0;vy++}renderCal()});
grid.addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(b)location.hash='#d='+b.dataset.d;});
allbox.addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(b)location.hash='#d='+b.dataset.d;});

/* ── 메모 (날짜별 여러 장) ── */
var mlist=document.getElementById('mlist'),savedEl=document.getElementById('saved'),curKey=null,curArr=[],saveT=null;
var viewCal=document.getElementById('view-cal'),viewMemo=document.getElementById('view-memo');
function renderMemo(k){
  curKey=k;
  curArr=(memos[k]&&memos[k].length)?memos[k].slice():[{id:uid(),text:'',t:Date.now()}];
  document.getElementById('mdate').textContent=dateLabel(k);
  buildCards();
  viewCal.hidden=true;viewMemo.hidden=false;
  window.scrollTo(0,0);
}
function buildCards(){
  mlist.innerHTML='';
  curArr.forEach(function(m){
    var d=document.createElement('div');d.className='sheet mcard';
    var t=document.createElement('textarea');
    t.setAttribute('data-m',m.id);t.setAttribute('aria-label','훈련 메모');
    t.value=m.text||'• ';
    var x=document.createElement('button');x.className='mdel';x.setAttribute('data-del',m.id);x.textContent='×';x.setAttribute('aria-label','메모 삭제');
    d.appendChild(t);d.appendChild(x);mlist.appendChild(d);
    grow(t);
  });
}
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,340)+'px';}
function focusLast(){var ts=mlist.querySelectorAll('textarea');if(ts.length){var t=ts[ts.length-1];t.focus();t.selectionStart=t.selectionEnd=t.value.length;}}
document.getElementById('addmemo').addEventListener('click',function(){
  curArr.push({id:uid(),text:'',t:Date.now()});
  buildCards();focusLast();
});
mlist.addEventListener('click',function(e){
  var b=e.target.closest('[data-del]');if(!b)return;
  if(!confirm('이 메모를 삭제할까요?'))return;
  curArr=curArr.filter(function(m){return m.id!==b.dataset.del});
  if(!curArr.length)curArr.push({id:uid(),text:'',t:Date.now()});
  saveNow();buildCards();
});
mlist.addEventListener('keydown',function(e){
  var ta=e.target;if(ta.tagName!=='TEXTAREA'||e.key!=='Enter'||e.isComposing)return;
  e.preventDefault();
  var st=ta.selectionStart,en=ta.selectionEnd;
  ta.value=ta.value.slice(0,st)+'\n• '+ta.value.slice(en);
  ta.selectionStart=ta.selectionEnd=st+3;
  ta.dispatchEvent(new Event('input'));
});
mlist.addEventListener('input',function(e){
  var ta=e.target;if(ta.tagName!=='TEXTAREA')return;
  if(e.inputType==='insertLineBreak'){
    var st=ta.selectionStart,ls2=ta.value.lastIndexOf('\n',st-1)+1;
    if(!ta.value.slice(ls2).startsWith('• ')){
      ta.value=ta.value.slice(0,ls2)+'• '+ta.value.slice(ls2);
      ta.selectionStart=ta.selectionEnd=st+2;
    }
  }
  grow(ta);
  var id=ta.getAttribute('data-m');
  curArr.forEach(function(m){if(m.id===id)m.text=ta.value});
  queueSave();
});
function collect(){var ts=mlist.querySelectorAll('textarea');curArr.forEach(function(m,i){if(ts[i])m.text=ts[i].value})}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,400)}
function saveNow(){
  if(!curKey)return;
  collect();
  var arr=curArr.filter(function(m){return realText(m.text)});
  if(arr.length)memos[curKey]=arr;else delete memos[curKey];
  saveData();
  savedEl.classList.add('show');setTimeout(function(){savedEl.classList.remove('show')},1200);
}
function backToCal(){location.hash='';}

/* ── 라우팅 ── */
function route(){
  if(curKey){clearTimeout(saveT);saveNow();curKey=null;}
  var m=location.hash.match(/^#d=(\d{4}-\d{2}-\d{2})$/);
  if(m){renderMemo(m[1])}
  else{viewMemo.hidden=true;viewCal.hidden=false;renderCal()}
}
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
